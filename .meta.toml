# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[meta]
template = "pure-python"
commit-id = "f63da99d"

[python]
with-pypy = true
with-sphinx-doctests = false
with-future-python = false
with-macos = false
with-windows = false
with-docs = false
with-free-threaded-python = false

[coverage]
fail-under = 95

[manifest]
additional-rules = [
    "recursive-include src *.po",
    "recursive-include src *.pot",
    "recursive-include src *.pt",
    "recursive-include src *.rst",
    "recursive-include src *.zcml",
    ]

[check-manifest]
ignore-bad-ideas = [
    "src/zope/app/form/browser/tests/locales/de/LC_MESSAGES/formtest.mo",
    "src/zope/app/form/browser/tests/testlabeltranslation.mo",
    ]
